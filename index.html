<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Prep</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <div id="banner" class="banner" role="alert" hidden></div>

  <main id="lock" class="lock">
    <form id="lock-form" class="lock-box" autocomplete="off">
      <h1 class="lock-title">Prep</h1>
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <label class="check"><input id="remember" type="checkbox"> <span>이 기기에서 기억하기</span></label>
      <p class="lock-warn">이 기기를 다른 사람이 쓰면 내용을 볼 수 있습니다</p>
      <button type="submit" class="btn primary">잠금 해제</button>
      <p id="lock-msg" class="lock-msg" role="status" aria-live="polite"></p>
      <noscript><p>JavaScript를 켜야 열 수 있습니다.</p></noscript>
    </form>
  </main>

  <div id="app" hidden>
    <header id="site-header" class="site-header"></header>
    <main id="view" class="view"></main>
  </div>
</body>
</html>
